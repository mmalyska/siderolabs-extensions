---
# Custom CI for nvgpu extension — uses GitHub-hosted arm64 runners.
# Pulls nvgpu-driver-pkg and nvmap-driver-pkg from ghcr.io/mmalyska (built by siderolabs-pkgs fork).
# nvgpu-toolkit builds nvidia-container-toolkit from source directly (no pkgs dependency).
concurrency:
  group: ${{ github.head_ref || github.run_id }}-nvgpu
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
      - feat/jetson-nvgpu
    tags:
      - v*
  pull_request:
    branches:
      - main
      - feat/jetson-nvgpu
  workflow_dispatch:
    inputs:
      pkgs_tag:
        description: "PKGS tag to build against for nvgpu kernel modules (e.g. v1.12.0-50-ga92bed5)"
        required: false
        default: "v1.12.6"
      talos_version:
        description: "Talos version to bake the installer for (e.g. v1.12.6)"
        required: false
        default: "v1.12.6"

name: nvgpu

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        run: |
          make nvgpu \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PKGS=${{ inputs.pkgs_tag || 'v1.12.6' }} \
            PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache"
          make nvgpu-toolkit \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu-toolkit:buildcache"

      - name: Build and push nvgpu
        if: github.event_name != 'pull_request'
        run: |
          make nvgpu \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PKGS=${{ inputs.pkgs_tag || 'v1.12.6' }} \
            PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} \
            PUSH=true \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache,mode=max"

      - name: Build and push nvgpu-toolkit
        if: github.event_name != 'pull_request'
        run: |
          make nvgpu-toolkit \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PUSH=true \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu-toolkit:buildcache --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu-toolkit:buildcache,mode=max"

      - name: Install crane
        if: github.event_name != 'pull_request'
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_arm64.tar.gz \
            | tar xz -C /usr/local/bin crane

      - name: Build and push installer
        if: github.event_name != 'pull_request'
        env:
          TALOS_VERSION: ${{ inputs.talos_version || 'v1.12.6' }}
          PKGS_TAG: ${{ inputs.pkgs_tag || 'v1.12.6' }}
        run: |
          NVGPU_DIGEST=$(jq -r '."containerimage.digest"' _out/nvgpu.metadata.json)
          echo "nvgpu digest: ${NVGPU_DIGEST}"

          NVGPU_TOOLKIT_DIGEST=$(jq -r '."containerimage.digest"' _out/nvgpu-toolkit.metadata.json)
          echo "nvgpu-toolkit digest: ${NVGPU_TOOLKIT_DIGEST}"

          git clone --depth 1 --branch ${TALOS_VERSION} https://github.com/siderolabs/talos
          cd talos

          make installer-base imager PLATFORM=linux/arm64 \
          INSTALLER_ARCH=arm64 \
          REGISTRY=ghcr.io \
          USERNAME=${{ github.repository_owner }} \
          IMAGE_TAG_OUT=${TALOS_VERSION} \
          PKG_KERNEL=ghcr.io/${{ github.repository_owner }}/kernel:${PKGS_TAG} \
          PUSH=true

          make image-installer \
          REGISTRY=ghcr.io \
          USERNAME=${{ github.repository_owner }} \
          IMAGER_ARGS="--base-installer-image=ghcr.io/${{ github.repository_owner }}/installer-base:${TALOS_VERSION} \
            --system-extension-image=ghcr.io/${{ github.repository_owner }}/nvgpu@${NVGPU_DIGEST} \
            --system-extension-image=ghcr.io/${{ github.repository_owner }}/nvgpu-toolkit@${NVGPU_TOOLKIT_DIGEST}"

          crane push _out/installer-arm64.tar ghcr.io/${{ github.repository_owner }}/talos-nv1-installer:${TALOS_VERSION}
