---
# Custom CI for nvgpu extension — uses GitHub-hosted arm64 runners.
# Pulls nvgpu-driver-pkg from ghcr.io/mmalyska (built by siderolabs-pkgs fork).
concurrency:
  group: ${{ github.head_ref || github.run_id }}-nvgpu
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
      - feat/jetson-nvgpu
    tags:
      - v*
  pull_request:
    branches:
      - main
      - feat/jetson-nvgpu
  workflow_dispatch:
    inputs:
      pkgs_tag:
        description: "PKGS tag to build against (e.g. v1.12.0-50-ga92bed5)"
        required: false
        default: "v1.12.0-50-ga92bed5-2-gf8ae6d4"
      talos_version:
        description: "Talos version to bake the installer for (e.g. v1.12.6)"
        required: false
        default: "v1.12.6"

name: nvgpu

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        run: |
          make nvgpu \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            # PKGS=${{ inputs.pkgs_tag || 'v1.12.0-50-ga92bed5-2-gf8ae6d4' }} \
            # PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache"

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          make nvgpu \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            # PKGS=${{ inputs.pkgs_tag || 'v1.12.0-50-ga92bed5-2-gf8ae6d4' }} \
            # PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} \
            PUSH=true \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache,mode=max"

      - name: Install crane
        if: github.event_name != 'pull_request'
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_arm64.tar.gz \
            | tar xz -C /usr/local/bin crane

      - name: Build and push installer
        if: github.event_name != 'pull_request'
        env:
          TALOS_VERSION: ${{ inputs.talos_version || 'v1.12.6' }}
        run: |
          DIGEST=$(jq -r '."containerimage.digest"' _out/nvgpu.metadata.json)
          echo "nvgpu digest: ${DIGEST}"
          
          git clone --depth 1 --branch ${TALOS_VERSION} https://github.com/siderolabs/talos
          cd talos

          make installer-base imager PLATFORM=linux/arm64 \
          INSTALLER_ARCH=arm64 \
          REGISTRY=ghcr.io \
          USERNAME=${{ github.repository_owner }} \
          IMAGE_TAG_OUT=${TALOS_VERSION} \
          PKG_KERNEL=ghcr.io/mmalyska/kernel:v1.12.1@sha256:79aa6527ff31e848247c952c1510a7c02973c6a48560ede6ff2897abc8c217bf \
          PUSH=true

          make image-installer \
          REGISTRY=ghcr.io \
          USERNAME=${{ github.repository_owner }} \
          IMAGER_ARGS="--base-installer-image=ghcr.io/${{ github.repository_owner }}/installer-base:${TALOS_VERSION} \
            --system-extension-image=ghcr.io/${{ github.repository_owner }}/nvgpu@${DIGEST}"

          crane push _out/installer-arm64.tar ghcr.io/${{ github.repository_owner }}/talos-nv1-installer:${TALOS_VERSION}
