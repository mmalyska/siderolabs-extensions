---
# Custom CI for nvgpu extension — uses GitHub-hosted arm64 runners.
# Pulls nvgpu-driver-pkg from ghcr.io/mmalyska (built by siderolabs-pkgs fork).
concurrency:
  group: ${{ github.head_ref || github.run_id }}-nvgpu
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
      - feat/jetson-nvgpu
    tags:
      - v*
  pull_request:
    branches:
      - main
      - feat/jetson-nvgpu
  workflow_dispatch:
    inputs:
      pkgs_tag:
        description: "PKGS tag to build against (e.g. v1.12.0-50-ga92bed5)"
        required: false
        default: "v1.12.0-50-ga92bed5-2-gf8ae6d4"
      talos_version:
        description: "Talos version to bake the installer for (e.g. v1.12.6)"
        required: false
        default: "v1.12.6"

name: nvgpu

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        run: |
          make nvgpu \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PKGS=${{ inputs.pkgs_tag || 'v1.12.0-50-ga92bed5-2-gf8ae6d4' }} \
            PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache"

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          make nvgpu \
            PLATFORM=linux/arm64 \
            REGISTRY=ghcr.io \
            USERNAME=${{ github.repository_owner }} \
            PKGS=${{ inputs.pkgs_tag || 'v1.12.0-50-ga92bed5-2-gf8ae6d4' }} \
            PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} \
            PUSH=true \
            CI_ARGS="--cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache --cache-to type=registry,ref=ghcr.io/${{ github.repository_owner }}/nvgpu:buildcache,mode=max"

      - name: Install crane
        if: github.event_name != 'pull_request'
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_arm64.tar.gz \
            | tar xz -C /usr/local/bin crane

      - name: Extract fork kernel vmlinuz
        if: github.event_name != 'pull_request'
        env:
          PKGS_TAG: ${{ inputs.pkgs_tag || 'v1.12.0-50-ga92bed5-2-gf8ae6d4' }}
        run: |
          # Pull the fork's kernel OCI (built in the same pkgs CI job as nvgpu-driver-pkg,
          # so kernel-build was cached → same signing key M as the nvgpu modules).
          docker pull ghcr.io/${{ github.repository_owner }}/talos-kernel:${PKGS_TAG}
          echo "Pulled talos-kernel:${PKGS_TAG} to extract vmlinuz"
          id=$(docker create ghcr.io/${{ github.repository_owner }}/talos-kernel:${PKGS_TAG} --entrypoint /bin/bash)
          echo "Created container ${id} to extract vmlinuz"
          docker cp ${id}:/boot/vmlinuz _out/vmlinuz-arm64
          docker rm ${id}
          echo "Extracted vmlinuz from talos-kernel:${PKGS_TAG}"

      - name: Build custom imager
        if: github.event_name != 'pull_request'
        env:
          TALOS_VERSION: ${{ inputs.talos_version || 'v1.12.6' }}
        run: |
          # Replace the official kernel in the imager with the fork's kernel.
          # This ensures the installer boots with signing key M, matching the nvgpu modules.
          cat > _out/Dockerfile.custom-imager <<EOF
          FROM ghcr.io/siderolabs/imager:${TALOS_VERSION}
          COPY vmlinuz-arm64 /usr/install/arm64/vmlinuz
          EOF
          docker build \
            --platform linux/arm64 \
            -f _out/Dockerfile.custom-imager \
            -t custom-imager:local \
            _out/

      - name: Build and push installer
        if: github.event_name != 'pull_request'
        env:
          TALOS_VERSION: ${{ inputs.talos_version || 'v1.12.6' }}
        run: |
          # Extract the digest of the just-built nvgpu extension image
          DIGEST=$(jq -r '."containerimage.digest"' _out/nvgpu.metadata.json)
          echo "nvgpu digest: ${DIGEST}"

          # Use the custom imager (fork kernel + official initramfs) to build the installer.
          # Output is an OCI archive at /out/installer-arm64.tar
          mkdir -p _out/installer
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${HOME}/.docker/config.json:/root/.docker/config.json:ro \
            -v $(pwd)/_out/installer:/out \
            custom-imager:local \
              installer \
              --arch arm64 \
              --system-extension-image ghcr.io/${{ github.repository_owner }}/nvgpu@${DIGEST} \
              --extra-kernel-arg console=tty0 \
              --extra-kernel-arg console=ttyS0,115200 \
              --extra-kernel-arg talos.auditd.disabled=1

          # Push the installer OCI archive to GHCR
          crane push \
            _out/installer/installer-arm64.tar \
            ghcr.io/${{ github.repository_owner }}/talos-nv1-installer:${TALOS_VERSION}

          # Print the pushed digest for talconfig.yaml reference
          echo "Installer pushed. Digest:"
          crane digest ghcr.io/${{ github.repository_owner }}/talos-nv1-installer:${TALOS_VERSION}
