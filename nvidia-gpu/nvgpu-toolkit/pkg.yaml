name: nvgpu-toolkit
variant: scratch
shell: /bin/bash
install:
  - build-base
  - gcc-14
  - bash
  - go
dependencies:
  - stage: base
  - image: cgr.dev/chainguard/wolfi-base@{{ .WOLFI_BASE_REF }}
steps:
  - sources:
      - url: https://github.com/NVIDIA/nvidia-container-toolkit/archive/refs/tags/{{ .CONTAINER_TOOLKIT_VERSION }}.tar.gz
        destination: container-toolkit.tar.gz
        sha256: {{ .CONTAINER_TOOLKIT_SHA256 }}
        sha512: {{ .CONTAINER_TOOLKIT_SHA512 }}
    env:
      CC: gcc-14
      CXX: g++-14
      GIT_COMMIT: "{{ substr 0 7 .CONTAINER_TOOLKIT_REF }}"
    prepare:
      - |
        mkdir -p /container-toolkit
        tar -xzf container-toolkit.tar.gz --strip-components=1 -C /container-toolkit
        cp -r /pkg/files/wrapper /wrapper
    build:
      - |
        # CGO is required — go-nvml/pkg/dl and internal/cuda have CGO-only implementations
        # (build constraints exclude all files when CGO_ENABLED=0).
        # Override EXTLDFLAGS with -static so the Makefile produces fully static musl binaries.
        # Talos has no dynamic linker in the extension overlay, so dynamic binaries won't run.
        # musl's static libc includes dlopen, so the binary can still lazy-load libnvidia-ml.so
        # at runtime if needed (not required for Tegra CSV-based device discovery).
        cd /container-toolkit
        make EXTLDFLAGS="-static" \
          cmd-nvidia-container-runtime \
          cmd-nvidia-container-runtime-hook \
          cmd-nvidia-container-runtime.cdi \
          cmd-nvidia-container-runtime.legacy \
          cmd-nvidia-ctk
      - |
        # Build the config-path wrapper as a pure-Go static binary (no CGO).
        # The wrapper sets NVIDIA_CTK_CONFIG_FILE_PATH before exec-ing the real binary,
        # because containerd sanitizes the environment when forking OCI runtime subprocesses
        # so machine.env values are not inherited. No shell needed — this is a compiled binary.
        cd /wrapper
        CGO_ENABLED=0 go build -ldflags="-s -w" -o /nvidia-container-runtime-wrapper .
    install:
      - |
        mkdir -p /rootfs/usr/local/bin
        cd /container-toolkit
        # Install all toolkit binaries except nvidia-container-runtime under their original names.
        find . -maxdepth 1 -type f -executable ! -name nvidia-container-runtime \
          -exec cp {} /rootfs/usr/local/bin/ \;
        # Install the real nvidia-container-runtime with .real suffix (exec'd by the wrapper).
        cp nvidia-container-runtime /rootfs/usr/local/bin/nvidia-container-runtime.real
        # Install the wrapper as nvidia-container-runtime — containerd invokes this.
        cp /nvidia-container-runtime-wrapper /rootfs/usr/local/bin/nvidia-container-runtime
      - |
        # Install config at /usr/local/etc/ (the path the wrapper injects via env var).
        # /etc/nvidia-container-runtime/ is blocked by extensions-validator; the wrapper
        # ensures the runtime always finds this path regardless of inherited environment.
        mkdir -p /rootfs/usr/local/etc/nvidia-container-runtime/host-files-for-container.d
        cp /pkg/files/l4t.csv /rootfs/usr/local/etc/nvidia-container-runtime/host-files-for-container.d/l4t.csv
        cp /pkg/files/config.toml /rootfs/usr/local/etc/nvidia-container-runtime/config.toml
      - |
        # Install containerd runtime handler config for nvidia handler
        mkdir -p /rootfs/etc/cri/conf.d
        cp /pkg/files/20-nvidia-runtime.part /rootfs/etc/cri/conf.d/20-nvidia-runtime.part
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
