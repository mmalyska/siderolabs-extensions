name: nvgpu-toolkit
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # Built by mmalyska/siderolabs-pkgs feat/jetson-nvgpu branch
  # Build with: make nvgpu-toolkit PKGS=<pkgs-tag> PKGS_PREFIX=ghcr.io/mmalyska
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/nvidia-container-toolkit-tegra-pkg:{{ .BUILD_ARG_PKGS }}"
steps:
  - install:
      - |
        # Install toolkit binaries directly — no wrapper needed.
        # NVIDIA_CTK_CONFIG_FILE_PATH is set via Talos machine.env so containerd and all
        # child processes (including nvidia-container-runtime) inherit the config path.
        mkdir -p /rootfs/usr/local/bin
        for bin in /usr/local/bin/nvidia-container-* /usr/local/bin/nvidia-ctk; do
          [ -f "${bin}" ] && cp "${bin}" "/rootfs/usr/local/bin/$(basename ${bin})"
        done
      - |
        # Install nvidia-container-runtime config pointing to the /usr/local/etc/ CSV path
        mkdir -p /rootfs/usr/local/etc/nvidia-container-runtime/host-files-for-container.d
        cp /pkg/files/l4t.csv /rootfs/usr/local/etc/nvidia-container-runtime/host-files-for-container.d/l4t.csv
        cp /pkg/files/config.toml /rootfs/usr/local/etc/nvidia-container-runtime/config.toml
      - |
        # Install containerd runtime handler config for nvidia handler
        mkdir -p /rootfs/etc/cri/conf.d
        cp /pkg/files/20-nvidia-runtime.part /rootfs/etc/cri/conf.d/20-nvidia-runtime.part
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
